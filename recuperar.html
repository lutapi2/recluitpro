<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecruitPro | Recuperar contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/tokens.css?v=6.0" />
    <link rel="stylesheet" href="css/components.css?v=6.0" />
  </head>
  <body>
    <main class="panel">
      <section class="card">
        <h2>Recuperar contraseña</h2>
        <p>Te enviaremos instrucciones si existe una cuenta verificada con ese correo.</p>
        <form id="recovery-form">
          <label for="recovery-email">Correo electrónico</label>
          <input id="recovery-email" type="email" autocomplete="email" required />
          <div id="recovery-message" class="notice-box" role="status"></div>
          <button class="primary" type="submit">Enviar instrucciones</button>
        </form>
        <p class="center"><a href="index.html">Volver a iniciar sesión</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
    <script src="js/ui.js?v=6.0"></script>
    <script src="js/recovery.js"></script>
  </body>
</html>
